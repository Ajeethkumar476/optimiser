<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Reminders Task</title>
    <style>
        /* Base styling: clean plain white theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Fullscreen Overlay UI */
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 40px;
        }
        .choice-container {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-choice-card {
            padding: 20px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid #000;
            background-color: #f9f9f9;
            transition: background-color 0.2s, transform 0.1s;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-choice-card:hover {
            background-color: #eaeaea;
            transform: translateY(-2px);
        }
        .btn-choice-card.primary-gateway {
            background-color: #f0f7ff;
            border: 2px solid #4A90E2;
            border-radius: 8px;
        }
        .btn-choice-card.primary-gateway:hover {
            background-color: #e1f0ff;
        }
        .btn-choice-card small {
            font-weight: normal;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }

        /* Form Controls for Registration */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 320px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #000;
            border-radius: 6px;
        }
        .error-text {
            color: red;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            display: none;
        }
        
        #loading-indicator {
            font-weight: bold;
            color: #4A90E2;
            margin-top: 15px;
            display: none;
        }

        /* Confidence Survey Container Layout */
        .survey-wrapper {
            margin: 20px auto;
            padding: 15px 25px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background: #fafafa;
            width: 100%;
            max-width: 450px;
        }
        .survey-label {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        .slider-control {
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }
        .slider-markers {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }

        /* Top Header Game Status Info */
        #game-header {
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* The Square Arena Window (75% of viewport with strict overflow mask) */
        #arena {
            position: relative;
            width: 75vmin;
            height: 75vmin;
            background-color: white;
            border-left: 5px solid #4A90E2;
            border-top: 5px solid orange;
            border-right: 5px solid pink;
            border-bottom: 5px solid black;
            overflow: hidden; 
        }

        /* Target Circles: Enlarged 1.5x (Width/Height set precisely to 18%) */
        .circle {
            position: absolute;
            width: 18%;
            height: 18%;
            border-radius: 50%;
            background-color: yellow;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.3rem;
            user-select: none;
            cursor: grab;
            touch-action: none;
            transition: background-color 0.5s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .circle.dragging {
            cursor: grabbing;
            z-index: 10;
            transition: background-color 0.1s ease;
        }
        .circle.locked {
            cursor: not-allowed;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="game-header">Initializing Experiment Pipeline...</div>

    <div id="overlay-screen">
        <h1 id="overlay-title" style="font-size: 2rem; margin-bottom: 15px;">Optimal Reminder Task</h1>
        <p id="overlay-desc" style="margin: 20px 0; max-width: 650px; font-size: 18px; line-height: 1.5; white-space: pre-line;"></p>
        <div id="mode-selection-box" class="choice-container"></div>
    </div>

    <div id="arena"></div>

    <script>
        // INSERT YOUR DEPLOYED WEB APP URL HERE
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAC-BP55NIRtUeEXzrwQHzETCcI45ob-ew3r2DgmTDeRsD-KNE-M_TGXielW1JMHbVA/exec";

        // Participant Metadata
        let playerIdentity = { name: '', email: '', rowId: null };

        // Experimental Pipeline States
        let totalScore = 0;
        let isTrialMode = true; 
        let trialsCompletedSuccessfully = false; 
        let currentTrialRound = 1; 
        let currentRound = 1;      
        let currentSubGame = '';   
        let gameIsFullyCompletedForUser = false;
        
        let currentNumberSequence = 1;
        let maxCircleLimit = 25;
        const maxSimultaneousCircles = 6;
        let totalCirclesPocketedInExperiment = 0;
        
        let activeCirclesMap = {};
        let targetCirclesData = {};
        let evenRunsConfig = {};   
        let oddRunPointsPool = []; 
        let activeMatchPointsWeight = 10; 
        
        let trialCorrectTargetsCount = 0; 
        let roundCorrectPocketsCount = 0; 

        let confidenceHistory = []; 
        let accuracyHistory = [];   

        // Explicit Global DOM references
        let headerElement, overlayElement, titleElement, descElement, modeSelectionBox, arenaElement;

        function assignEvenRunsLayout() {
            evenRunsConfig = {};
            let evenRounds = [2, 4, 6, 8, 10, 12, 14, 16];
            let modesPool = [
                'reminder', 'reminder', 'reminder', 'reminder',
                'no-reminder', 'no-reminder', 'no-reminder', 'no-reminder'
            ];
            modesPool.sort(() => Math.random() - 0.5);
            for (let i = 0; i < evenRounds.length; i++) {
                evenRunsConfig[evenRounds[i]] = modesPool[i];
            }
        }

        function generateOddRunsPointsPool() {
            oddRunPointsPool = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            oddRunPointsPool.sort(() => Math.random() - 0.5);
        }

        window.onload = function() {
            headerElement = document.getElementById('game-header');
            overlayElement = document.getElementById('overlay-screen');
            titleElement = document.getElementById('overlay-title');
            descElement = document.getElementById('overlay-desc');
            modeSelectionBox = document.getElementById('mode-selection-box');
            arenaElement = document.getElementById('arena');

            assignEvenRunsLayout();
            generateOddRunsPointsPool();
            displayRegistrationForm();
        };

        // Screen 1: Mandatory Registration Form
        function displayRegistrationForm() {
            arenaElement.innerHTML = '';
            overlayElement.style.display = 'flex';
            modeSelectionBox.innerHTML = '';
            headerElement.innerText = "Participant Verification";

            titleElement.innerText = "Welcome to the Experiment";
            descElement.innerText = "Please input your Name and Email ID to load your personal session data state.";

            let formWrapper = document.createElement('div');
            formWrapper.style.display = 'flex';
            formWrapper.style.flexDirection = 'column';
            formWrapper.style.alignItems = 'center';
            formWrapper.style.width = '100%';

            formWrapper.innerHTML = `
                <div class="form-group">
                    <label for="reg-name">Full Name *</label>
                    <input type="text" id="reg-name" placeholder="John Doe">
                    <div id="name-error" class="error-text">Name is required.</div>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address *</label>
                    <input type="email" id="reg-email" placeholder="john.doe@example.com">
                    <div id="email-error" class="error-text">Please enter a valid email address.</div>
                </div>
                <button id="btn-submit-reg" class="btn-choice-card primary-gateway" style="margin-top: 15px; width: 100%; max-width: 320px;">
                    <span>Verify Profile State</span>
                </button>
                <div id="loading-indicator">Querying database cloud records... Please hold.</div>
            `;

            modeSelectionBox.appendChild(formWrapper);

            document.getElementById('btn-submit-reg').onclick = function() {
                let nameInput = document.getElementById('reg-name').value.trim();
                let emailInput = document.getElementById('reg-email').value.trim();
                let nameError = document.getElementById('name-error');
                let emailError = document.getElementById('email-error');
                let loader = document.getElementById('loading-indicator');

                let isValid = true;
                if (!nameInput) { nameError.style.display = 'block'; isValid = false; } else { nameError.style.display = 'none'; }

                let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailInput || !emailRegex.test(emailInput)) { emailError.style.display = 'block'; isValid = false; } else { emailError.style.display = 'none'; }

                if (isValid) {
                    playerIdentity.name = nameInput;
                    playerIdentity.email = emailInput.toLowerCase();
                    loader.style.display = 'block';
                    
                    // Fetch profile status securely from your script
                    fetchProfileStatusFromServer();
                }
            };
        }

        function fetchProfileStatusFromServer() {
            if (GOOGLE_SHEET_SCRIPT_URL === "YOUR_SCRIPT_URL_HERE") {
                // Mock execution layer fallback if spreadsheet is absent
                console.warn("App script target missing. Continuing via fallback variables.");
                trialsCompletedSuccessfully = false;
                displayInitialModeGateway();
                return;
            }

            fetch(GOOGLE_SHEET_SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'register', name: playerIdentity.name, email: playerIdentity.email })
            })
            .then(res => res.json())
            .then(json => {
                playerIdentity.rowId = json.rowId;
                trialsCompletedSuccessfully = json.trialsCompleted;
                currentRound = json.nextRound;
                gameIsFullyCompletedForUser = json.gameComplete;
                totalScore = json.accumulatedScore;
                totalCirclesPocketedInExperiment = json.accumulatedCircles;
                
                if (gameIsFullyCompletedForUser) {
                    displayGameFinishedScreen();
                } else {
                    displayInitialModeGateway();
                }
            })
            .catch(err => {
                console.error("Profile validation error:", err);
                // Fail-safe default strategy behavior
                displayInitialModeGateway();
            });
        }

        function displayGameFinishedScreen() {
            arenaElement.innerHTML = '';
            overlayElement.style.display = 'flex';
            modeSelectionBox.innerHTML = '';
            headerElement.innerText = "Experiment Pipeline Complete";
            titleElement.innerText = "All 17 Rounds Completed!";
            descElement.innerText = `Hello ${playerIdentity.name}, You have successfully finished the entire experiment.\n\nThank you for participating!\n\nFinal Score: ${totalScore} points | Circles Pocketed: ${totalCirclesPocketedInExperiment}`;
        }

        // Screen 2: Dynamic Gateway Router Screen (Conforms to image_0d6e65.png request)
        function displayInitialModeGateway() {
            arenaElement.innerHTML = '';
            overlayElement.style.display = 'flex';
            modeSelectionBox.innerHTML = '';
            headerElement.innerText = "Welcome to the Optimal Reminder Task";
            titleElement.innerText = "Select Session Pathway";
            descElement.innerText = "Choose whether you want to play the training/eligibility trial sessions first or bypass them to start the experiment blocks directly.";

            if (!trialsCompletedSuccessfully) {
                // Fresh session or mid-trial refresh: starts from Trial 1 by default
                isTrialMode = true;
                currentTrialRound = 1;
                
                let trialBtn = document.createElement('button');
                trialBtn.className = 'btn-choice-card primary-gateway';
                trialBtn.innerHTML = `
                    <span>Run Training Trials<br>(Recommended)</span>
                    <small>The Trial experiment has 6 rounds which helps you to understand the basics and points system of the main experiment.</small>
                `;
                trialBtn.onclick = () => startTrialRoundLifecycle();
                modeSelectionBox.appendChild(trialBtn);
            } else {
                // Post-Trial State or Mid-Experiment refresh: proceeds directly to the uncompleted main round index
                isTrialMode = false;
                
                let directMainBtn = document.createElement('button');
                directMainBtn.className = 'btn-choice-card primary-gateway';
                directMainBtn.innerHTML = `
                    <span>Launch Main Experiment</span>
                    <small>Training credentials confirmed. Click here to resume the Main Run starting from **Round ${currentRound} of 17**.</small>
                `;
                directMainBtn.onclick = () => startNewRoundLifecycle();
                modeSelectionBox.appendChild(directMainBtn);
            }
        }

        let sliderHasBeenInteractedWith = false;

        function createConfidenceSliderMarkup() {
            sliderHasBeenInteractedWith = false;

            let container = document.createElement('div');
            container.className = 'survey-wrapper';
            container.innerHTML = `
                <label class="survey-label">Confidence Level for Round ${currentRound}: <span id="val-indicator">0</span>%</label>
                <input type="range" min="0" max="100" step="5" value="0" class="slider-control" id="confidence-range-slider">
                <div class="slider-markers">
                    <span>0% (Not Sure)</span>
                    <span>50%</span>
                    <span>100% (Certain)</span>
                </div>
                <div id="survey-error-msg" style="color: red; font-size: 14px; font-weight: bold; margin-top: 12px; display: none;">
                    Please set your confidence level by interacting with the progress bar slider before starting the game.
                </div>
            `;
            setTimeout(() => {
                let slider = document.getElementById('confidence-range-slider');
                let indicator = document.getElementById('val-indicator');
                if (slider && indicator) {
                    slider.addEventListener('input', () => { 
                        indicator.innerText = slider.value; 
                        sliderHasBeenInteractedWith = true;
                        let errorMsg = document.getElementById('survey-error-msg');
                        if (errorMsg) errorMsg.style.display = 'none';
                    });
                }
            }, 50);
            return container;
        }

        // ================= TRIAL TRACK LIFE-CYCLE EXECUTION CONTROLLERS =================
        function startTrialRoundLifecycle() {
			arenaElement.innerHTML = '';
			overlayElement.style.display = 'flex';
			modeSelectionBox.innerHTML = '';
			updateHeaderMetrics();

			let runBtn = document.createElement('button');
			runBtn.className = 'btn-choice-card';
			runBtn.style.maxWidth = "100%";
			runBtn.innerHTML = "<span>Start Trial Game</span>";

			let displaySurveyBar = (currentTrialRound === 4 || currentTrialRound === 6);
			let surveyMarkup = null;
			if (displaySurveyBar) {
				surveyMarkup = createConfidenceSliderMarkup();
				overlayElement.insertBefore(surveyMarkup, modeSelectionBox);
				surveyMarkup.querySelector('.survey-label').innerHTML = `Confidence Level for Trial Stage ${currentTrialRound}: <span id="val-indicator">0</span>%`;
			}

			const handleTrialLaunch = (mode, points) => {
				if (displaySurveyBar) {
					if (!sliderHasBeenInteractedWith) {
						let errorMsg = document.getElementById('survey-error-msg');
						if (errorMsg) errorMsg.style.display = 'block';
						return;
					}
					let sliderVal = document.getElementById('confidence-range-slider').value;
					confidenceHistory.push({ round: `Trial-${currentTrialRound}`, mode: mode, value: parseInt(sliderVal) });
					if (surveyMarkup) surveyMarkup.remove();
				}
				launchActiveMatchInstance(mode, points);
			};

			switch(currentTrialRound) {
				case 1:
					titleElement.innerText = "Trial Stage 1 \nIn this experiment you will have a simple task to do";
					descElement.innerText = "You will see several yellow circles inside a box. Inside each circle will be a number.You can move them around using your mouse. Your task is to drag them to the bottom of the box in sequence. Please start by dragging 1 all the way to the bottom. This will make it disappear. Then drag 2 to the bottom, then 3, and so on.";
					maxCircleLimit = 8;
					runBtn.onclick = () => launchActiveMatchInstance('no-reminder', 10);
					break;
				case 2:
					titleElement.innerText = "Trial Stage 2 \nNow with one special circle with 8 numbers";
					descElement.innerText = "Now you will see 8 circles in the trail. You have to drag the circles to the bottom. \nAmong 8 circles there will be one special circle that will be a different color. \nThe colored circles has to be dragged to the side of square that matches with the special circle";
					maxCircleLimit = 8;
					runBtn.onclick = () => launchActiveMatchInstance('no-reminder', 10);
					break;
				case 3:
					titleElement.innerText = "Trial Stage 3\nNow it will get more difficult.";
					descElement.innerText = "There will be a total of 25 circles and 10 of them will be special ones that should go to one of the colored circles of the box. \nDon’t worry if you do not remember all of them. That’s fine- just try to remember as many as you can.";
					maxCircleLimit = 25;
					runBtn.onclick = () => launchActiveMatchInstance('reminder', 10);
					break;
				case 4:
					titleElement.innerText = "Trial Stage 4 \nIn this trail, we are going to explain a strategy that can make the task easier";
					descElement.innerText = "When you see a special circle, you can set a reminder by quickly dragging the special circle to the intended part of the box. \nExample: If the special circle appears in blue color you have to drag it to the blue (left) side of the box. Thus, this help you to correctly drag the special circle in the sequence its location would remind you where it is supposed to go. Try the upcoming task, using this strategy to help you.";
					maxCircleLimit = 25;
					runBtn.onclick = () => handleTrialLaunch('reminder', 10);
					break;
				case 5:
					titleElement.innerText = "Trial Stage 5";
					descElement.innerText = "Now there will be a total of 25 circles and 10 of them will be special circles that should go to intended coloured sides of the box. You should use the reminder in this trail.";
					maxCircleLimit = 25;
					runBtn.onclick = () => launchActiveMatchInstance('reminder', 10);
					break;
				case 6:
					titleElement.innerText = "Trial Stage 6";
					descElement.innerText = " Now this trail repeats the same procedure of task 5. There will be a total of 25 circles and 10 of them will be special circles that should go to intended coloured sides of the box. You should use the reminder in this trail.";
					maxCircleLimit = 25;
					runBtn.onclick = () => handleTrialLaunch('reminder', 10);
					break;
			}

			modeSelectionBox.appendChild(runBtn);
		}

        // ================= EXPERIMENT LIFE-CYCLE CONTROLLERS =================
        function startNewRoundLifecycle() {
            presentModeSelectionOverlay();
        }

        function presentModeSelectionOverlay() {
			arenaElement.innerHTML = '';
			overlayElement.style.display = 'flex';
			modeSelectionBox.innerHTML = '';
			updateHeaderMetrics();

			if (currentRound > 17) {
                gameIsFullyCompletedForUser = true;
                displayGameFinishedScreen();
				return;
			}

			titleElement.innerText = `Main Task Run: Round ${currentRound}`;
			
			let displaySurveyBar = (currentRound === 1 || currentRound % 2 === 0);
			let surveyMarkup = null;

			if (displaySurveyBar) {
				surveyMarkup = createConfidenceSliderMarkup();
				overlayElement.insertBefore(surveyMarkup, modeSelectionBox);
			}

			if (currentRound % 2 !== 0) {
				let oddIndex = Math.floor(currentRound / 2);
				let assignedReminderPoints = oddRunPointsPool[oddIndex];

				descElement.innerText = `From now on, you will be allocated points for each correct response.
                                        You have to aim for getting maximum number of points in the upcoming trails.
                                        You will have 17 upcoming trails, you’ll be given instructions before the start of each trial. Read the instructions carefully and move further.
                                        In certain trails the instruction will say, “This time you will be allowed to set reminders.” When this happens you must reminders for the special circles.
                                        And other times, “This time you are not allowed to set reminders”. When this happens you cannot set reminders for the special circles. 
                                        In certain trails, you will not be given choices and instructed to do it either with or without reminders. 
                                        For few trails, you will be given choice to choose between two options. You should choose whichever option you think will score you the most points.`;

				let reminderBtn = document.createElement('button');
				reminderBtn.className = 'btn-choice-card';
				reminderBtn.innerHTML = `
					<span>Game Style: Reminders Allowed</span>
					<small>You can set early spatial markers next to any edge except bottom.<br><br><strong>Correct Match:</strong> +${assignedReminderPoints} Points</small>
				`;
				reminderBtn.onclick = () => {
					if (displaySurveyBar) {
						if (!sliderHasBeenInteractedWith) {
							let errorMsg = document.getElementById('survey-error-msg');
							if (errorMsg) errorMsg.style.display = 'block';
							return;
						}
						let sliderVal = document.getElementById('confidence-range-slider').value;
						confidenceHistory.push({ round: currentRound, mode: 'reminder', value: parseInt(sliderVal) });
						if (surveyMarkup) surveyMarkup.remove();
					}
					maxCircleLimit = 25; 
					launchActiveMatchInstance('reminder', assignedReminderPoints);
				};
				modeSelectionBox.appendChild(reminderBtn);

				let sequentialBtn = document.createElement('button');
				sequentialBtn.className = 'btn-choice-card';
				sequentialBtn.innerHTML = `
					<span>Game Style: Reminders not allowed</span>
					<small>Circles are completely locked until it is their numerical turn.<br><br><strong>Correct Match:</strong> +10 Points</small>
				`;
				sequentialBtn.onclick = () => {
					if (displaySurveyBar) {
						if (!sliderHasBeenInteractedWith) {
							let errorMsg = document.getElementById('survey-error-msg');
							if (errorMsg) errorMsg.style.display = 'block';
							return;
						}
						let sliderVal = document.getElementById('confidence-range-slider').value;
						confidenceHistory.push({ round: currentRound, mode: 'no-reminder', value: parseInt(sliderVal) });
						if (surveyMarkup) surveyMarkup.remove();
					}
					maxCircleLimit = 25; 
					launchActiveMatchInstance('no-reminder', 10);
				};
				modeSelectionBox.appendChild(sequentialBtn);

			} else {
				let assignedType = evenRunsConfig[currentRound];
				descElement.innerText = "This is an even-numbered round. Your game configuration has been pre-assigned dynamically.";

				let launchForcedBtn = document.createElement('button');
				launchForcedBtn.className = 'btn-choice-card';
				launchForcedBtn.style.maxWidth = "100%";

				if (assignedType === 'reminder') {
					launchForcedBtn.innerHTML = `
						<span>Play Assigned Stage: Reminders Allowed</span>
						<small>You can set early spatial markers next to any edge except bottom.<br><br><strong>Correct Match:</strong> +10 Points</small>
						`;
				} else {
					launchForcedBtn.innerHTML = `
						<span>Play Assigned Stage: Reminders not allowed</span>
						<small>Circles are completely locked until it is their numerical turn.<br><br><strong>Correct Match:</strong> +10 Points</small>
					`;
				}

				launchForcedBtn.onclick = () => {
					if (displaySurveyBar) {
						if (!sliderHasBeenInteractedWith) {
							let errorMsg = document.getElementById('survey-error-msg');
							if (errorMsg) errorMsg.style.display = 'block';
							return;
						}
						let sliderVal = document.getElementById('confidence-range-slider').value;
						confidenceHistory.push({ round: currentRound, mode: assignedType, value: parseInt(sliderVal) });
						if (surveyMarkup) surveyMarkup.remove();
					}
					maxCircleLimit = 25; 
					launchActiveMatchInstance(assignedType, 10);
				};
				modeSelectionBox.appendChild(launchForcedBtn);
			}
		}

        function getUnstagedSpecialOnBoard() {
            if (currentSubGame !== 'reminder') return null;
            for (let num in activeCirclesMap) {
                if (targetCirclesData[num]?.isTarget && !targetCirclesData[num].isReminderSet) {
                    return parseInt(num);
                }
            }
            return null;
        }

        function launchActiveMatchInstance(gameType, scoreWeight) {
            overlayElement.style.display = 'none';
            currentSubGame = gameType;
            activeMatchPointsWeight = scoreWeight; 
            currentNumberSequence = 1;
            trialCorrectTargetsCount = 0;
            roundCorrectPocketsCount = 0;
            activeCirclesMap = {};
            targetCirclesData = {};

            let targetsPool = [];
            let specialCount = 0;

            if (isTrialMode) {
                if (currentTrialRound === 2) specialCount = 1;
                else if (currentTrialRound >= 3) specialCount = 10;
            } else {
                specialCount = 10; 
            }

            if (specialCount > 0) {
                for (let i = 7; i <= maxCircleLimit; i++) targetsPool.push(i);
                targetsPool.sort(() => Math.random() - 0.5);
                
                let chosen = targetsPool.slice(0, specialCount);
                const borderOptions = ['left', 'top', 'right'];
                chosen.forEach(num => {
                    targetCirclesData[num] = {
                        isTarget: true,
                        targetSide: borderOptions[Math.floor(Math.random() * borderOptions.length)],
                        isReminderSet: false
                    };
                });
            }

            updateHeaderMetrics();

            let initialCount = Math.min(maxSimultaneousCircles, maxCircleLimit);
            for (let i = 1; i <= initialCount; i++) {
                spawnInteractiveCircle(i);
            }
        }

        function updateHeaderMetrics() {
            if (isTrialMode) {
                headerElement.innerText = `Training Trial Stage: ${currentTrialRound}/6`;
            } else {
                const variantTag = currentSubGame === 'reminder' 
                    ? `Reminders Permitted (+${activeMatchPointsWeight} pts)` 
                    : "Strict Sequence (Locked)";
                headerElement.innerText = `Round ${currentRound}/17 | ${variantTag}`;
            }
        }

        function spawnInteractiveCircle(num) {
            if (num > maxCircleLimit) return;

            const node = document.createElement('div');
            node.className = 'circle';
            node.innerText = num;
            node.id = `circle-item-${num}`;

            let coordinatesFound = false;
            let percentX, percentY;

            while (!coordinatesFound) {
                percentX = Math.random() * 78 + 2; 
                percentY = Math.random() * 78 + 2;
                coordinatesFound = true;

                for (let existingIndex in activeCirclesMap) {
                    let spatialDistance = Math.hypot(activeCirclesMap[existingIndex].x - percentX, activeCirclesMap[existingIndex].y - percentY);
                    if (spatialDistance < 19) { 
                        coordinatesFound = false;
                    }
                }
            }

            activeCirclesMap[num] = { x: percentX, y: percentY, DOMElement: node, baselineColor: 'yellow' };
            node.style.left = `${percentX}%`;
            node.style.top = `${percentY}%`;

            attachPointerInteractionSystems(node, num);
            arenaElement.appendChild(node);

            if (targetCirclesData[num]?.isTarget) {
                let colorKey = 'yellow';
                if (targetCirclesData[num].targetSide === 'left') colorKey = '#4A90E2';
                if (targetCirclesData[num].targetSide === 'top') colorKey = 'orange';
                if (targetCirclesData[num].targetSide === 'right') colorKey = 'pink';

                node.style.backgroundColor = colorKey;
                activeCirclesMap[num].baselineColor = colorKey;

                setTimeout(() => {
                    if (activeCirclesMap[num]) {
                        node.style.backgroundColor = 'yellow';
                        activeCirclesMap[num].baselineColor = 'yellow';
                    }
                }, 1500);
            }
        }

        function checkMergeSide(leftPercent, topPercent) {
            if (leftPercent < 0) return 'left';
            if (topPercent < 0) return 'top';
            if (leftPercent + 18 > 100) return 'right';
            if (topPercent + 18 > 100) return 'bottom';
            return null;
        }

        function checkProximityToAnyEdge(leftPercent, topPercent) {
            const threshold = 10;
            if (leftPercent <= threshold) return 'left';
            if (topPercent <= threshold) return 'top';
            if ((100 - (leftPercent + 18)) <= threshold) return 'right';
            if ((100 - (topPercent + 18)) <= threshold) return 'bottom';
            return null;
        }

        function attachPointerInteractionSystems(element, numberIndex) {
            let trackingDragState = false;
            let clientStartX, clientStartY;
            let structuralOriginLeft, structuralOriginTop;

            element.addEventListener('pointerdown', (e) => {
                if (currentSubGame === 'no-reminder' && numberIndex !== currentNumberSequence) {
                    element.classList.add('locked');
                    setTimeout(() => element.classList.remove('locked'), 300);
                    return; 
                }

                let mandatoryTargetNum = getUnstagedSpecialOnBoard();
                if (mandatoryTargetNum !== null && numberIndex !== mandatoryTargetNum) {
                    element.classList.add('locked');
                    setTimeout(() => element.classList.remove('locked'), 300);
                    return;
                }

                trackingDragState = true;
                element.classList.add('dragging');
                element.setPointerCapture(e.pointerId);

                structuralOriginLeft = activeCirclesMap[numberIndex].x;
                structuralOriginTop = activeCirclesMap[numberIndex].y;

                clientStartX = e.clientX;
                clientStartY = e.clientY;
            });

            element.addEventListener('pointermove', (e) => {
                if (!trackingDragState) return;

                const parentArenaRect = arenaElement.getBoundingClientRect();
                let horizontalShift = ((e.clientX - clientStartX) / parentArenaRect.width) * 100;
                let verticalShift = ((e.clientY - clientStartY) / parentArenaRect.height) * 100;

                let updatedLeft = structuralOriginLeft + horizontalShift;
                let updatedTop = structuralOriginTop + verticalShift;

                if (updatedLeft < -22) updatedLeft = -22;
                if (updatedLeft > 104) updatedLeft = 104; 
                if (updatedTop < -22) updatedTop = -22;
                if (updatedTop > 104) updatedTop = 104;

                element.style.left = `${updatedLeft}%`;
                element.style.top = `${updatedTop}%`;
                activeCirclesMap[numberIndex].x = updatedLeft;
                activeCirclesMap[numberIndex].y = updatedTop;

                let activeMergeSide = checkMergeSide(updatedLeft, updatedTop);
                
                if (activeMergeSide) {
                    if (activeMergeSide === 'bottom') {
                        element.style.backgroundColor = activeCirclesMap[numberIndex].baselineColor;
                    } else {
                        let isSpecialCircle = targetCirclesData[numberIndex]?.isTarget;
                        element.style.backgroundColor = isSpecialCircle ? 'green' : 'red';
                    }
                } else {
                    element.style.backgroundColor = activeCirclesMap[numberIndex].baselineColor;
                }
            });

            element.addEventListener('pointerup', (e) => {
                if (!trackingDragState) return;
                trackingDragState = false;
                element.classList.remove('dragging');

                const dropPositionLeft = activeCirclesMap[numberIndex].x;
                const dropPositionTop = activeCirclesMap[numberIndex].y;

                let evaluatedSideZone = checkMergeSide(dropPositionLeft, dropPositionTop);

                if (evaluatedSideZone) {
                    if (numberIndex === currentNumberSequence) {
                        processTargetResolution(numberIndex, evaluatedSideZone, element);
                        return;
                    } else {
                        if (currentSubGame === 'reminder' && targetCirclesData[numberIndex]?.isTarget) {
                            let nearbyEdge = checkProximityToAnyEdge(dropPositionLeft, dropPositionTop);
                            if (nearbyEdge !== null && nearbyEdge !== 'bottom' && checkMergeSide(dropPositionLeft, dropPositionTop) === null) {
                                targetCirclesData[numberIndex].isReminderSet = true;
                                element.style.backgroundColor = 'yellow';
                                return;
                            }
                        }
                        snapCircleBackToOrigin(element, numberIndex, structuralOriginLeft, structuralOriginTop);
                        return;
                    }
                }

                if (currentSubGame === 'reminder' && targetCirclesData[numberIndex]?.isTarget) {
                    let nearbyEdge = checkProximityToAnyEdge(dropPositionLeft, dropPositionTop);
                    if (nearbyEdge !== null && nearbyEdge !== 'bottom') {
                        targetCirclesData[numberIndex].isReminderSet = true;
                        element.style.backgroundColor = 'yellow';
                        return;
                    }
                }

                snapCircleBackToOrigin(element, numberIndex, structuralOriginLeft, structuralOriginTop);
            });
        }

        function snapCircleBackToOrigin(element, numberIndex, origLeft, origTop) {
            element.style.left = `${origLeft}%`;
            element.style.top = `${origTop}%`;
            activeCirclesMap[numberIndex].x = origLeft;
            activeCirclesMap[numberIndex].y = origTop;
            element.style.backgroundColor = activeCirclesMap[numberIndex].baselineColor;
        }

        function processTargetResolution(num, finishedZone, objectReference) {
            let activeTargetMetric = targetCirclesData[num]?.isTarget;
            let expectedCorrectZone = activeTargetMetric ? targetCirclesData[num].targetSide : 'bottom';
            let isCorrect = (finishedZone === expectedCorrectZone);

            if (activeTargetMetric && isCorrect) {
                roundCorrectPocketsCount++;
                if (!isTrialMode) totalCirclesPocketedInExperiment++;
            }

            if (!isTrialMode) {
                if (activeTargetMetric && isCorrect) {
                    totalScore += activeMatchPointsWeight; 
                }
            } else {
                if (activeTargetMetric && isCorrect) {
                    trialCorrectTargetsCount++;
                }
            }

            let targetSlideLeft = activeCirclesMap[num].x;
            let targetSlideTop = activeCirclesMap[num].y;

            if (finishedZone === 'left') targetSlideLeft = -30;
            else if (finishedZone === 'top') targetSlideTop = -30;
            else if (finishedZone === 'right') targetSlideLeft = 120;
            else if (finishedZone === 'bottom') targetSlideTop = 120;

            objectReference.style.backgroundColor = (finishedZone === 'bottom') ? activeCirclesMap[num].baselineColor : (isCorrect ? 'green' : 'red');
            objectReference.style.transform = 'scale(0.4)';
            objectReference.style.opacity = '0';
            objectReference.style.left = `${targetSlideLeft}%`;
            objectReference.style.top = `${targetSlideTop}%`;

            setTimeout(() => {
                objectReference.remove();
                delete activeCirclesMap[num];

                currentNumberSequence++;
                let consecutiveSpawnIndex = currentNumberSequence + 5;
                if (consecutiveSpawnIndex <= maxCircleLimit) {
                    spawnInteractiveCircle(consecutiveSpawnIndex);
                }

                if (currentNumberSequence > maxCircleLimit) {
                    if (isTrialMode) {
                        evaluateTrialMatchCompletion(isCorrect);
                    } else {
                        evaluateMainMatchCompletion();
                    }
                }
            }, 400); 
        }

        function evaluateTrialMatchCompletion(lastTargetWasCorrect) {
            arenaElement.innerHTML = '';
            overlayElement.style.display = 'flex';
            modeSelectionBox.innerHTML = '';

            let progressBtn = document.createElement('button');
            progressBtn.className = 'btn-choice-card';
            progressBtn.style.maxWidth = "100%";

            if (currentTrialRound === 2 && !lastTargetWasCorrect) {
                titleElement.innerText = "Trial Stage 2 Failed";
                descElement.innerText = "You missed the colored special target. Training rules require you to repeat this stage until cleared successfully.";
                progressBtn.innerHTML = "<span>Retry Trial 2</span>";
                progressBtn.onclick = () => launchActiveMatchInstance('no-reminder', 10);
                modeSelectionBox.appendChild(progressBtn);
                return;
            }

            if (currentTrialRound === 5 && trialCorrectTargetsCount < 8) {
                titleElement.innerText = "Eligibility Check Failed";
                descElement.innerText = `You cleared only ${trialCorrectTargetsCount}/10 targets correctly. You must clear at least 8 to pass eligibility guidelines.`;
                progressBtn.innerHTML = "<span>Retry Eligibility Check</span>";
                progressBtn.onclick = () => launchActiveMatchInstance('reminder', 10);
                modeSelectionBox.appendChild(progressBtn);
                return;
            }

            titleElement.innerText = `Training Stage ${currentTrialRound} Completed`;
            descElement.innerText = currentTrialRound === 5 
                ? `Exceptional! You cleared ${trialCorrectTargetsCount}/10 targets correctly and verified strategy eligibility.`
                : "Task executed successfully.";

            if (currentTrialRound < 6) {
                progressBtn.innerHTML = "<span>Proceed to Next Trial</span>";
                progressBtn.onclick = () => {
                    currentTrialRound++;
                    startTrialRoundLifecycle();
                };
            } else {
                // Instantly flips the database-backed visibility settings
                trialsCompletedSuccessfully = true;
                progressBtn.innerHTML = "<span>Return to Home Gateway</span>";
                progressBtn.onclick = () => {
                    displayInitialModeGateway();
                };
            }
            modeSelectionBox.appendChild(progressBtn);
        }

        function evaluateMainMatchCompletion() {
            accuracyHistory.push({ round: currentRound, mode: currentSubGame, score: roundCorrectPocketsCount });

            // Send full aggregate mid-game counts on each round completion
            syncDataToSheets({
                action: 'syncRound',
                rowId: playerIdentity.rowId,
                round: currentRound,
                score: roundCorrectPocketsCount,
                totalCircles: totalCirclesPocketedInExperiment,
                totalScore: totalScore
            });

            currentSubGame = ''; 
            arenaElement.innerHTML = '';
            overlayElement.style.display = 'flex';
            modeSelectionBox.innerHTML = '';
            
            titleElement.innerText = `Round ${currentRound} Complete`;
            descElement.innerText = `You have completed this round.\n\nCurrent Total Accumulated Score: ${totalScore} points.`;
            
            let nextRoundBtn = document.createElement('button');
            nextRoundBtn.className = 'btn-choice-card';
            nextRoundBtn.style.maxWidth = "100%";
            nextRoundBtn.innerHTML = "<span>Proceed Next</span>";
            nextRoundBtn.onclick = () => {
                currentRound++;
                startNewRoundLifecycle();
            };
            modeSelectionBox.appendChild(nextRoundBtn);
        }

        // Global Sheets Sync Pipeline Implementation
        function syncDataToSheets(payload) {
            if (GOOGLE_SHEET_SCRIPT_URL === "YOUR_SCRIPT_URL_HERE") return;

            fetch(GOOGLE_SHEET_SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify(payload)
            })
            .catch(err => console.error("Sheets transmission network drop:", err));
        }
    </script>
</body>
